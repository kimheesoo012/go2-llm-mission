<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관제자 알림 데모</title>
<style>
  :root{--bg:#f3f4f6;--panel:#fff;--line:#d5d9df;--text:#1f2933;--sub:#5b6673;
        --l3:#b42318;--l3bg:#fdecea;--l2:#b25e09;--l2bg:#fdf3e2;--l1:#2f6ea8;--l1bg:#e9f1f8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  main{max-width:920px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:18px;margin:0 0 4px} .note{color:var(--sub);font-size:13px;margin:0 0 14px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  button{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--panel);border-radius:2px;cursor:pointer}
  button.primary{background:#182b47;color:#fff;border-color:#182b47}
  #clock{font-variant-numeric:tabular-nums;color:var(--sub)}
  .stage{position:relative;background:#11161d;border-radius:2px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#8b97a5}
  .stage.urgent{outline:4px solid var(--l3);outline-offset:-4px}
  #alerts{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-direction:column;gap:6px}
  .alert{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-left:5px solid;background:var(--panel);color:var(--text);border-radius:2px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .alert.l3{border-color:var(--l3);background:var(--l3bg)} .alert.l2{border-color:var(--l2);background:var(--l2bg)} .alert.l1{border-color:var(--l1);background:var(--l1bg)}
  .tag{flex:none;font-size:12px;font-weight:700;padding:1px 7px;border-radius:2px;color:#fff;margin-top:2px}
  .l3 .tag{background:var(--l3)} .l2 .tag{background:var(--l2)} .l1 .tag{background:var(--l1)}
  .body{flex:1;min-width:0} .title{font-weight:700} .msg{font-size:13px;color:#39424e;overflow-wrap:anywhere}
  .meta{font-size:12px;color:var(--sub)}
  .alert button{flex:none;font-size:13px;padding:3px 10px}
  table{width:100%;border-collapse:collapse;margin-top:16px;background:var(--panel);font-size:13px}
  th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top} th{background:#eceef1}
  tr.now td{background:#fffbe6}
</style>
</head>
<body>
<main>
  <h1>관제자 알림 데모</h1>
  <p class="note">demo/replay_demo.py의 60초 장면(가상)을 재생합니다. 알림 판정은 Python 모듈(alerts.py)이 하고, 이 페이지는 그 결과를 화면에 띄우는 부분만 보여 줍니다.</p>
  <div class="bar">
    <button class="primary" id="play">재생</button>
    <button id="reset">처음으로</button>
    <label><input type="checkbox" id="sound" checked> 경고음</label>
    <span id="clock">0.0초</span>
  </div>
  <div class="stage" id="stage">
    <span>로봇 영상 영역</span>
    <div id="alerts" aria-live="assertive"></div>
  </div>
  <table>
    <thead><tr><th style="width:70px">시각</th><th style="width:150px">입력</th><th>판정 결과</th></tr></thead>
    <tbody id="log"></tbody>
  </table>
</main>
<script>
// Output of AlertCenter for the scripted scene (see demo/replay_demo.py). In the console this
// comes from the status API: fetch('/api/status') -> data.alerts = alert_center.active()
const SCENE = [
  {t:5,  input:"음성 기록: 안녕하세요", result:"표시 없음", alerts:[]},
  {t:22, input:"음성 기록: 사랑해주세요 ×4", result:"도움 요청 의심 (확인 필요)", alerts:[
    {id:"s1",kind:"speech",level:2,label:"확인 필요",title:"도움 요청 의심 발화",count:1,sound:true,
     message:"'사랑해주세요' 4회 반복 · '살려주세요'와 유사(0.75) · 원본 음성 확인 필요"}]},
  {t:25, input:"누운 자세 15초 지속", result:"누운 자세 지속 (긴급 확인)", alerts:[
    {id:"l1",kind:"lying",level:3,label:"긴급 확인",title:"누운 자세 지속",count:1,sound:true,
     message:"누운 자세가 15초 이상 이어서 관측됨 · 같은 시간대에 도움 요청 의심 발화 기록 (발화자 미확인)"},
    {id:"s1",kind:"speech",level:2,label:"확인 필요",title:"도움 요청 의심 발화",count:1,sound:false,
     message:"'사랑해주세요' 4회 반복 · '살려주세요'와 유사(0.75) · 원본 음성 확인 필요"}]},
  {t:30, input:"음성 기록: 살려주세요 ×2", result:"도움 요청 (긴급 확인) · 기존 발화 알림을 올림", alerts:[
    {id:"s1",kind:"speech",level:3,label:"긴급 확인",title:"도움 요청 발화",count:2,sound:true,
     message:"도움 요청 표현 '살려주세요' 2회 · 같은 시간대에 누운 자세 지속 관측 (발화자 미확인)"},
    {id:"l1",kind:"lying",level:3,label:"긴급 확인",title:"누운 자세 지속",count:1,sound:false,
     message:"누운 자세가 15초 이상 이어서 관측됨 · 같은 시간대에 도움 요청 의심 발화 기록 (발화자 미확인)"}]},
  {t:41, input:"앉은 자세로 바뀜", result:"누운 자세 종료 (알림은 확인 전까지 유지)", alerts:null}
];

// ---- the part to copy into the console page ---------------------------
const acked = new Set(), sounded = new Map();
let audio = null;
function beep(level){
  if(!document.getElementById('sound').checked) return;
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const n = level >= 3 ? 3 : 1;
    for(let i = 0; i < n; i++){
      const o = audio.createOscillator(), g = audio.createGain(), at = audio.currentTime + i * .28;
      o.frequency.value = level >= 3 ? 880 : 660; g.gain.setValueAtTime(.18, at); g.gain.exponentialRampToValueAtTime(.001, at + .22);
      o.connect(g); g.connect(audio.destination); o.start(at); o.stop(at + .24);
    }
  }catch(e){ /* sound is optional */ }
}
function renderAlerts(alerts){
  const box = document.getElementById('alerts'); box.textContent = '';
  const shown = alerts.filter(a => !acked.has(a.id));
  for(const a of shown){
    const row = document.createElement('div'); row.className = 'alert l' + a.level;
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = a.label;
    const body = document.createElement('div'); body.className = 'body';
    const title = document.createElement('div'); title.className = 'title'; title.textContent = a.title + (a.count > 1 ? ' ×' + a.count : '');
    const msg = document.createElement('div'); msg.className = 'msg'; msg.textContent = a.message;   // textContent: STT text is untrusted
    body.append(title, msg);
    const ok = document.createElement('button'); ok.textContent = '확인';
    ok.onclick = () => { acked.add(a.id); renderAlerts(alerts); };   // console: POST /api/alert_ack {id}
    row.append(tag, body, ok); box.append(row);
    if(a.level >= 2 && (sounded.get(a.id) || 0) < a.level){ sounded.set(a.id, a.level); beep(a.level); }  // once per level
  }
  document.getElementById('stage').classList.toggle('urgent', shown.some(a => a.level >= 3));
}
// -----------------------------------------------------------------------

let timer = null, t = 0, current = [];
function draw(){
  document.getElementById('clock').textContent = t.toFixed(1) + '초';
  const log = document.getElementById('log'); log.textContent = '';
  for(const s of SCENE){
    if(s.t > t) break;
    if(s.alerts) current = s.alerts;
    const tr = document.createElement('tr'); if(t - s.t < 3) tr.className = 'now';
    for(const v of [s.t + '초', s.input, s.result]){ const td = document.createElement('td'); td.textContent = v; tr.append(td); }
    log.append(tr);
  }
  renderAlerts(current);
}
function reset(){ clearInterval(timer); timer = null; t = 0; current = []; acked.clear(); sounded.clear(); draw(); }
document.getElementById('play').onclick = () => { if(timer) return; timer = setInterval(() => { t += .5; draw(); if(t >= 45){ clearInterval(timer); timer = null; } }, 100); };
document.getElementById('reset').onclick = reset;
const at = new URLSearchParams(location.search).get('t');
if(at){ t = parseFloat(at); for(const s of SCENE){ if(s.t <= t && s.alerts) current = s.alerts; } }
draw();
</script>
</body>
</html>
